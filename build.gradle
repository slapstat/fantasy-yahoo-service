plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.github.spotbugs' version '6.5.13'
}

group = 'com.fantasy'
// No `version`: the release version is the git tag tag-on-merge.yml derives from the PR title,
// stamped into the running app as APP_VERSION.

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Error tracking: ERROR-level logs are forwarded to Sentry (see logback-spring.xml).
	// Active only when SENTRY_DSN is set (prod/staging); inert locally and in CI/tests.
	implementation 'io.sentry:sentry-logback:8.61.1'

	// Database migrations
	// Spring Boot 4 split autoconfiguration into per-technology modules; the
	// Flyway integration (FlywayAutoConfiguration) lives in spring-boot-flyway,
	// which is no longer pulled in transitively by flyway-core alone.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// PostgreSQL driver (runtime)
	runtimeOnly 'org.postgresql:postgresql'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Tests run against in-memory H2 (no Docker needed in CI)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Static analysis: SpotBugs bug patterns + FindSecBugs security rules.
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	// Forward -DupdateSpec=true to the test JVM so OpenApiSpecSnapshotTest can
	// rewrite specs/openapi.yaml instead of asserting against it.
	systemProperty 'updateSpec', System.getProperty('updateSpec', 'false')
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Only build the executable Spring Boot jar (skip the non-runnable "-plain" jar)
// so the Docker image can copy build/libs/*.jar unambiguously.
tasks.named('jar') {
	enabled = false
}

// Static analysis (SpotBugs + FindSecBugs). A few non-actionable patterns are excluded
// (see config/spotbugs/exclude.xml); the build fails on any remaining finding.
spotbugs {
	toolVersion = '4.10.2'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
	excludeFilter = file('config/spotbugs/exclude.xml')
	ignoreFailures = false
}

tasks.named('spotbugsMain') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('spotbugsTest') {
	enabled = false
}
