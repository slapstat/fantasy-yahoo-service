spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Mirror the main config's media type so the spec generated under test matches the
# committed specs/openapi.yaml (the test resources otherwise shadow application.yaml).
springdoc:
  default-produces-media-type: application/json

# Non-secret dummy key so the context boots (the filter requires a key). Full-context tests
# that call a protected endpoint send this value in the X-Internal-Api-Key header.
internal:
  api-key: test-internal-key

# The OAuth secrets are validated at startup and have no default, and these test resources
# shadow application.yaml, so the context needs values here. None of them is a real credential;
# the AES key is base64 of 32 zero bytes.
yahoo:
  oauth:
    client-id: test-client-id
    client-secret: test-client-secret
    state-secret: test-state-secret
    token-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  fantasy:
    connect-retry-backoff-ms: 0

# The season a sync collects has no default in the app — a run has to know which season it is
# writing, and guessing would file one season's numbers under another. These test resources
# shadow application.yaml, so the value is set here rather than inherited.
sync:
  yahoo-season: 2025
