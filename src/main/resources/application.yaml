spring:
  application:
    name: fantasy-yahoo-service
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_OPTIONS is empty locally and on the deployed Coolify Postgres (same Docker
    # network, no TLS); set it to "?sslmode=require" when connecting to a managed
    # Postgres over a public/TLS link.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy_yahoo}${DB_OPTIONS:}
    username: ${DB_USER:fantasy}
    # No default — the password is always supplied via the DB_PASSWORD env var
    # (Coolify in the deployed envs; your shell locally). Never commit a password here.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8088}

# Pre-shared secret the BFF sends as X-Internal-Api-Key. Required in every environment: the
# app refuses to start if this is blank, so it never serves an unauthenticated internal API
# (this service holds per-user Yahoo OAuth tokens). Set INTERNAL_API_KEY when running locally
# too; tests supply their own key.
internal:
  api-key: ${INTERNAL_API_KEY:}

# Yahoo OAuth 2.0 + Fantasy Sports API.
# The four secrets have no default and are required in every environment, local included:
# the app refuses to start when one is missing, blank, or (the encryption key) not 32 bytes,
# rather than deploying healthy and failing at a user's first Yahoo connect. Provide them via
# env vars, never in git; tests supply dummy values. Non-secret URLs and the scope carry defaults.
yahoo:
  oauth:
    client-id: ${YAHOO_CLIENT_ID}
    client-secret: ${YAHOO_CLIENT_SECRET}
    # The callback URL registered with the Yahoo app — must match exactly. Yahoo rejects
    # localhost and shared free-hosting domains, so each env needs a custom domain
    # (yahoo.slapstat.com / yahoo.staging.slapstat.com).
    redirect-uri: ${YAHOO_REDIRECT_URI:http://localhost:8088/api/v1/yahoo/oauth/callback}
    scope: ${YAHOO_SCOPE:fspt-r}
    # HMAC key for the short-lived OAuth state (carries the app user id).
    state-secret: ${YAHOO_STATE_SECRET}
    # Base64 256-bit AES key for encrypting stored tokens (openssl rand -base64 32).
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    # Where the browser is redirected after a successful connect (the web app).
    web-post-connect-url: ${WEB_POST_CONNECT_URL:http://localhost:4200}
    login-base-url: ${YAHOO_LOGIN_BASE_URL:https://api.login.yahoo.com}
    api-base-url: ${YAHOO_API_BASE_URL:https://fantasysports.yahooapis.com/fantasy/v2}
  players:
    # Pause between retries of a player page that failed to reach Yahoo, in milliseconds
    # (the delay grows with the attempt; three attempts, then the read fails). Reading the
    # pool takes up to 80 sequential calls and a gap cannot be tolerated — the sync removes
    # the players it does not see — so one timeout would otherwise discard the whole run.
    # 0 disables the pause, which is what the tests use.
    page-retry-backoff-ms: ${YAHOO_PAGE_RETRY_BACKOFF_MS:2000}
  fantasy:
    # Pause before the one retry of a Fantasy API call whose connection failed before the
    # request was sent, in milliseconds. Only connect failures are retried; 0 disables the
    # pause, which is what the tests use.
    connect-retry-backoff-ms: ${YAHOO_CONNECT_RETRY_BACKOFF_MS:200}

# Player read-model cache: refresh the skaters/goalies tables from Yahoo.
sync:
  # The season being collected, as a start year (2025 = the 2025-26 season). A run caches the
  # current player pool plus this season's stat line; earlier seasons are left alone. Move it
  # forward when a new season starts — what the app *shows* is a separate choice, made by the
  # BFF, so collecting 2026 does not disturb a 2025 reference column.
  yahoo-season: ${SYNC_YAHOO_SEASON:2025}
  # Off-season kill switch: true makes the scheduled sync skip its run instead of calling
  # Yahoo (between NHL seasons there is no active game, so the call 403s), keeping the daily
  # failure out of the logs and Sentry. Flip together with the web's YAHOO_SYNC_DISABLED.
  disabled: ${SYNC_YAHOO_DISABLED:false}
  # Scheduled refresh. Disabled by default (local/CI); enable + set a cron in the
  # deployed envs so the player data refreshes automatically.
  schedule:
    enabled: ${SYNC_SCHEDULE_ENABLED:false}
    cron: ${SYNC_SCHEDULE_CRON:0 0 4 * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-yahoo-service
    version: ${APP_VERSION:dev}
